[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xeno"
version = "0.1.0"
description = "Solana memecoin scanner and on-chain risk analyzer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
xeno = "xeno.cli:main"

[tool.setuptools.packages.find]
include = ["xeno*"]

[tool.setuptools.package-data]
xeno = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
