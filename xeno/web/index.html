<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080B11">
<title>XENO</title>
<style>
/* ===================================================================
   XENO - Oberflaeche

   Gestaltungsgedanke: ein Messgeraet, das nachts laeuft. Kein helles
   Web-Dashboard, sondern eine dunkle Anzeige mit einem kuehlen Akzent
   und warmen Warnfarben.

   Die eine Entscheidung, aus der alles folgt: **jede Zahl steht in
   Mono mit Tabellenziffern.** Dieses Werkzeug zeigt fast nur Zahlen,
   und untereinander vergleichbar sind sie nur, wenn die Ziffern
   gleich breit sind.

   Der Akzent ist bewusst kuehl (Aqua). Die vier Urteilsfarben sind
   allesamt warm - so kollidiert der Akzent nie mit einer Statusfarbe,
   und "wichtig" laesst sich von "gefaehrlich" unterscheiden.
   =================================================================== */

:root {
  --ground:    #080B11;
  --panel:     #101620;
  --panel-2:   #18202C;
  --line:      #222C3A;
  --line-soft: #171E29;

  --text:      #DDE5F2;
  --text-dim:  #9AA7B8;
  --muted:     #6B7789;

  --accent:    #35D6C5;
  --accent-dim:#1B6F68;

  /* Warme Rampe fuer die Urteile - klar getrennt vom kuehlen Akzent. */
  --ok:        #41D98E;
  --caution:   #EAB63C;
  --risky:     #F2903F;
  --avoid:     #F45B62;
  --unknown:   #64707F;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --r: 13px;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 620px at 50% -10%, #0E1622 0%, transparent 70%),
    var(--ground);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom);
}

/* Alle Zahlen gleich breit - sonst springt jede Aktualisierung. */
.num, .figures b, .stat b, table.trades td, .score, .pl, .mint, pre.log {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

button, input {
  font: inherit; color: inherit;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 13px; cursor: pointer;
  transition: background .15s ease, border-color .15s ease, transform .1s ease;
}
button:hover { background: #202A38; border-color: #2E3A4B; }
button:active { transform: scale(.97); }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button.primary { background: var(--accent); color: #05231F; border-color: transparent; font-weight: 600; }
button.primary:hover { background: #4AE6D5; }
button.danger { color: var(--avoid); border-color: rgba(244,91,98,.3); }
button:disabled { opacity: .5; cursor: default; }

input { width: 100%; }
input::placeholder { color: var(--muted); }

/* ---- Kopf ---------------------------------------------------------- */

header {
  position: sticky; top: 0; z-index: 40;
  padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
  background: rgba(8,11,17,.82);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border-bottom: 1px solid var(--line-soft);
}
/* Auf einem breiten Bildschirm klebte der Name ganz links, waehrend der
   Inhalt darunter mittig in seiner 640er-Spalte stand - zwei Achsen auf
   einer Seite. Der Kopf bekommt dieselbe Spalte. */
.brand, .sub { max-width: 640px; margin-left: auto; margin-right: auto; }

.brand { display: flex; align-items: center; gap: 11px; }

h1 {
  margin: 0; font-size: 19px; font-weight: 700;
  letter-spacing: .22em; text-transform: uppercase;
}

/* Der Puls sagt "ich arbeite noch" - die einzige Bewegung, die auch dann
   etwas mitteilt, wenn seit Minuten nichts passiert ist. */
.pulse { position: relative; width: 9px; height: 9px; flex: none; }
.pulse i {
  position: absolute; inset: 0; border-radius: 50%;
  background: var(--muted); display: block;
}
.pulse.on i { background: var(--accent); }
.pulse.on::after {
  content: ""; position: absolute; inset: -3px;
  border-radius: 50%; border: 1px solid var(--accent);
  animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite;
}
@keyframes ping {
  0%   { transform: scale(.7); opacity: .9; }
  70%  { transform: scale(2.1); opacity: 0; }
  100% { opacity: 0; }
}

/* Ring bis zum naechsten Durchlauf. Kein Zierrat: er beantwortet die
   Frage "wann schaut er wieder nach", ohne dass man das Log oeffnet. */
.ring { width: 30px; height: 30px; flex: none; margin-left: auto; }
.ring circle { fill: none; stroke-width: 2.5; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }

.sub {
  margin-top: 7px; font-size: 12px; color: var(--muted);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.sub .num { color: var(--text-dim); }

main { max-width: 640px; margin: 0 auto; padding: 12px 16px 60px; }

/* ---- Suche ---------------------------------------------------------- */

.search { display: flex; gap: 8px; margin-bottom: 11px; }
.search button { flex: none; }
.search input { background: var(--panel); border-color: var(--line-soft); }
.search input:focus { border-color: rgba(53,214,197,.45); }
/* Der Name steht klein unter dem Ticker: bei einer Suche nach "bonk" kommen
   ein Dutzend Token mit demselben Kuerzel zurueck. */
.hit-name { font-size: 12px; color: var(--muted); margin: -3px 0 2px; }
.hit-state { font-size: 11px; color: var(--muted); }

/* ---- Kennzahlen ---------------------------------------------------- */

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 11px; }
.stat {
  background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: 10px; padding: 7px 6px; text-align: center;
}
.stat b { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; }
.stat span {
  display: block; color: var(--muted);
  font-size: 8.5px; text-transform: uppercase; letter-spacing: .08em;
}
/* Kurzes Aufleuchten, wenn sich ein Wert aendert - sonst uebersieht man
   es bei einer Anzeige, die sich alle fuenf Sekunden selbst neu zeichnet. */
.stat b.bump { animation: bump .8s ease; }
@keyframes bump {
  0%   { color: var(--accent); transform: translateY(-2px); }
  100% { color: inherit; transform: none; }
}

/* ---- Reiter -------------------------------------------------------- */

nav {
  display: flex; gap: 3px; background: var(--panel);
  border: 1px solid var(--line-soft); border-radius: 11px;
  padding: 3px; margin-bottom: 11px; overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: 1; white-space: nowrap; background: transparent; border: none;
  padding: 7px 11px; font-size: 12.5px; color: var(--muted); border-radius: 8px;
}
nav button.active { background: var(--panel-2); color: var(--text); font-weight: 600; }

/* ---- Kompakte Liste -------------------------------------------------
   Bei 158 geprueften Token ist die grosse Karte das falsche Format: es
   passen fuenf auf einen Bildschirm, und man scrollt minutenlang. Eine
   Zeile zeigt zwanzig auf einmal.

   Eine Liste ist zum Ueberblicken da, nicht zum Lesen. Deshalb stehen in
   der Zeile nur die vier Werte, nach denen man sortiert und sucht -
   Urteil, Groesse, Richtung, Punktzahl. Alles Weitere steht im
   Detailblatt, einen Fingertipp entfernt.                              */

.rows {
  border: 1px solid var(--line-soft); border-radius: var(--r);
  background: var(--panel); overflow: hidden; box-shadow: var(--shadow);
}
.r {
  display: grid;
  grid-template-columns: 3px 1fr 52px 60px 46px 26px;
  align-items: center; gap: 8px;
  padding: 0 12px 0 0;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  transition: background .12s ease;
}
.r:last-child { border-bottom: none; }
.r:hover  { background: var(--panel-2); }
.r:active { background: #1D2634; }
.r.wl { background: rgba(53,214,197,.045); }

/* Der Farbstreifen traegt das Urteil - beim Durchscrollen liest man ihn,
   ohne ein einziges Wort zu entziffern. */
.bar { align-self: stretch; min-height: 42px; background: var(--unknown); }
.bar.v-OK      { background: var(--ok); }
.bar.v-CAUTION { background: var(--caution); }
.bar.v-RISKY   { background: var(--risky); }
.bar.v-AVOID   { background: var(--avoid); }
.bar.v-CALL    { background: var(--accent); }
.bar.v-CONTROL { background: var(--line); }

.r-name { min-width: 0; padding: 7px 0; }
.r-sym  { font-weight: 600; font-size: 13.5px; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
.r-sub  { font-size: 10px; color: var(--muted); margin-top: 1px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-num  { text-align: right; font-family: var(--mono);
          font-variant-numeric: tabular-nums; font-size: 12px; }
.r-score { text-align: right; font-family: var(--mono); font-size: 11.5px;
           color: var(--muted); }
.r .spark { height: 26px; margin: 0; }
.r .spark .area { opacity: .16; }
.r .mark { color: var(--accent); }

/* ---- Filterleiste ---------------------------------------------------
   Mit neunhundert Token entscheidet nicht das Layout, ob man etwas
   findet, sondern ob man die Menge einschraenken kann. */
.chips { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto;
         scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font-size: 11.5px; padding: 5px 10px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line-soft);
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--line); }
.chip.on { background: var(--panel-2); color: var(--text); border-color: var(--line); }
.chip b { font-family: var(--mono); font-weight: 600; margin-left: 4px; }
.more { width: 100%; margin-top: 9px; font-size: 12.5px; color: var(--text-dim); }
.sec { font-size: 10px; color: var(--muted); margin: 20px 0 8px;
       text-transform: uppercase; letter-spacing: .1em; }

/* ---- Karten -------------------------------------------------------- */

.card {
  position: relative; background: var(--panel);
  border: 1px solid var(--line-soft); border-left: 3px solid var(--unknown);
  border-radius: var(--r); padding: 13px 14px; margin-bottom: 9px;
  box-shadow: var(--shadow);
}
.card.tappable { cursor: pointer; transition: border-color .15s ease, transform .1s ease; }
.card.tappable:hover { border-color: var(--line); }
.card.tappable:active { transform: scale(.995); }
/* Die Farbkante traegt das Urteil - beim Durchscrollen liest man sie,
   ohne die Plakette zu entziffern. */
.card.v-OK      { border-left-color: var(--ok); }
.card.v-CAUTION { border-left-color: var(--caution); }
.card.v-RISKY   { border-left-color: var(--risky); }
.card.v-AVOID   { border-left-color: var(--avoid); }
.card.v-CONTROL { border-left-color: var(--line); }
.card.wl { box-shadow: var(--shadow), inset 3px 0 0 -1px var(--accent); }

/* Gestaffeltes Einblenden: was neu dazukommt, faellt auf. */
.card.in { animation: rise .34s cubic-bezier(.2,.7,.3,1) backwards; }
@keyframes rise {
  from { opacity: 0; transform: translateY(9px); }
  to   { opacity: 1; transform: none; }
}

.card-head { display: flex; align-items: center; gap: 9px; }
.badge {
  font-size: 10px; font-weight: 700; letter-spacing: .07em;
  padding: 3px 8px; border-radius: 6px; flex: none; font-family: var(--mono);
}
.b-OK      { background: rgba(65,217,142,.14);  color: var(--ok); }
.b-CAUTION { background: rgba(234,182,60,.14);  color: var(--caution); }
.b-RISKY   { background: rgba(242,144,63,.14);  color: var(--risky); }
.b-AVOID   { background: rgba(244,91,98,.14);   color: var(--avoid); }
.b-UNKNOWN { background: rgba(100,112,127,.14); color: var(--unknown); }
.b-CONTROL { background: rgba(100,112,127,.10); color: var(--muted); }
.b-CALL    { background: rgba(53,214,197,.14);  color: var(--accent); }
/* Aufwacher tragen die Akzentfarbe als Rahmen statt als Fläche: es ist
   kein Urteil, sondern ein Hinweis, dass dort gerade etwas passiert. */
.b-WAKE    { background: transparent; color: var(--accent);
             box-shadow: inset 0 0 0 1px rgba(53,214,197,.45); }

.sym { font-weight: 600; flex: 1; min-width: 0; overflow: hidden;
       text-overflow: ellipsis; white-space: nowrap; }
.score { color: var(--muted); font-size: 12.5px; flex: none; }

.trend { font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
         padding: 2px 6px; border-radius: 5px; margin-left: 7px; vertical-align: 1px; }
.t-up       { background: rgba(65,217,142,.13); color: var(--ok); }
.t-down     { background: rgba(244,91,98,.13);  color: var(--avoid); }
.t-sideways { background: rgba(100,112,127,.13); color: var(--muted); }

/* ---- Sparkline ------------------------------------------------------ */

.spark { display: block; width: 100%; height: 42px; margin-top: 11px; }
.spark path.area { opacity: .16; }
.spark path.line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.spark circle { r: 2.4; }
.spark .grid { stroke: var(--line-soft); stroke-width: 1; vector-effect: non-scaling-stroke; }
/* Die Linie zeichnet sich einmal - danach ist sie ruhig. */
.spark path.line.draw { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw .9s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---- Zahlenraster --------------------------------------------------- */

.figures { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px 8px; margin-top: 11px; }
.figures div { min-width: 0; }
.figures b {
  display: block; font-size: 13px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.figures span {
  display: block; font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; margin-top: 1px;
}
.up { color: var(--ok); }
.down { color: var(--avoid); }

.asof { color: var(--muted); font-size: 10.5px; margin-top: 9px; }

.finding {
  font-size: 12.5px; margin-top: 6px; padding-left: 16px;
  position: relative; color: var(--text-dim);
}
.finding::before {
  content: ""; position: absolute; left: 3px; top: 7px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--unknown);
}
.finding.critical::before, .finding.high::before { background: var(--avoid); }
.finding.medium::before { background: var(--caution); }
.finding.low::before { background: var(--risky); }

.mint { font-size: 10.5px; color: var(--muted); margin-top: 9px; word-break: break-all; }

.links { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; }
.links a {
  font-size: 11px; color: var(--accent); text-decoration: none;
  border: 1px solid rgba(53,214,197,.22); border-radius: 6px; padding: 2px 8px;
}
.links a:hover { background: rgba(53,214,197,.08); }

.card-actions { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
.card-actions button { padding: 7px 11px; font-size: 12.5px; }

/* ---- Positionszeile -------------------------------------------------- */

.pos {
  display: flex; align-items: baseline; gap: 8px; margin-top: 10px;
  padding-top: 10px; border-top: 1px dashed var(--line);
  font-size: 12.5px; font-family: var(--mono); font-variant-numeric: tabular-nums;
}
.pos .arrow { color: var(--muted); }
.pos .pl { margin-left: auto; font-weight: 600; }
.plus { color: var(--ok); }
.minus { color: var(--avoid); }

/* ---- Tabelle --------------------------------------------------------- */

.wrap-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.trades { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.trades th {
  text-align: right; color: var(--muted); font-weight: 500; font-size: 9.5px;
  text-transform: uppercase; letter-spacing: .06em; padding: 7px 5px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.trades th:first-child, table.trades td:first-child { text-align: left; }
table.trades td { text-align: right; padding: 9px 5px; border-bottom: 1px solid var(--line-soft); }
table.trades tr:last-child td { border-bottom: none; }
table.trades tr.best td { background: rgba(53,214,197,.055); }
/* Zu wenige Trades, um etwas zu bedeuten. Blass statt versteckt: die Zeile
   gehoert in die Tabelle, ihr Ergebnis aber in keinen Vergleich. */
table.trades tr.thin td { opacity: .45; }
.grp { font-weight: 600; font-family: var(--sans); }

/* ---- Hinweise, Leerzustaende ----------------------------------------- */

.note {
  background: rgba(53,214,197,.06); border: 1px solid rgba(53,214,197,.16);
  border-radius: 11px; padding: 11px 13px; font-size: 12.5px;
  color: var(--text-dim); margin-bottom: 12px;
}
.note.warn { background: rgba(234,182,60,.06); border-color: rgba(234,182,60,.2); }
.note b { color: var(--text); }

.empty { color: var(--muted); text-align: center; padding: 46px 20px; font-size: 13.5px; line-height: 1.7; }

/* Skelett statt "lade …" - es zeigt schon die Form dessen, was kommt. */
.skel { background: var(--panel); border: 1px solid var(--line-soft);
        border-left: 3px solid var(--line); border-radius: var(--r);
        height: 108px; margin-bottom: 9px; position: relative; overflow: hidden; }
.skel::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.035), transparent);
  animation: sweep 1.4s ease-in-out infinite;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

pre.log {
  background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: var(--r); padding: 13px; font-size: 11.5px;
  color: var(--text-dim); overflow-x: auto; white-space: pre-wrap;
  word-break: break-word; margin: 0; line-height: 1.65;
}

.spin {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: rot .7s linear infinite; vertical-align: -1px;
}
@keyframes rot { to { transform: rotate(360deg); } }

.row { display: flex; gap: 8px; }
.row button { flex: none; }

/* ---- Detailblatt ------------------------------------------------------ */

.scrim {
  position: fixed; inset: 0; z-index: 50; background: rgba(3,6,10,.66);
  backdrop-filter: blur(3px); opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; z-index: 51; left: 0; right: 0; bottom: 0;
  max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(26px + env(safe-area-inset-bottom));
  transform: translateY(101%); transition: transform .3s cubic-bezier(.2,.75,.3,1);
  box-shadow: 0 -18px 50px -20px rgba(0,0,0,.85);
}
.sheet.open { transform: none; }
.grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line);
        margin: 6px auto 14px; }
@media (min-width: 680px) {
  .sheet { left: 50%; right: auto; bottom: 0; width: 640px; transform: translate(-50%, 101%); }
  .sheet.open { transform: translate(-50%, 0); }
}

.sheet h2 { margin: 0; font-size: 17px; }
.sheet h3 {
  margin: 20px 0 8px; font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
}

@media (prefers-reduced-motion: reduce) {
  *, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="pulse" id="pulse"><i></i></span>
    <h1>Xeno</h1>
    <button id="bell" hidden onclick="askNotify()" title="Benachrichtigungen erlauben">🔔</button>
    <svg class="ring" id="ring" viewBox="0 0 36 36" aria-hidden="true">
      <circle class="bg" cx="18" cy="18" r="15"></circle>
      <circle class="fg" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="94.2"></circle>
    </svg>
    <button id="toggle" onclick="toggleWatcher()">…</button>
  </div>
  <div class="sub" id="sub">verbinde …</div>
</header>

<main>
  <form class="search" onsubmit="lookup(); return false">
    <input id="q" placeholder="Mint-Adresse oder Name …"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="primary" id="go" type="submit">Prüfen</button>
  </form>

  <div id="notes"></div>

  <div class="stats">
    <div class="stat"><b id="s-checked">–</b><span>Geprüft</span></div>
    <div class="stat"><b id="s-tokens">–</b><span>Token</span></div>
    <div class="stat"><b id="s-wl">–</b><span>Watchlist</span></div>
    <div class="stat"><b id="s-alerts">–</b><span>Meldungen</span></div>
  </div>

  <nav>
    <button class="active" data-tab="tokens" onclick="showTab('tokens')">Token</button>
    <button data-tab="watchlist" onclick="showTab('watchlist')">Watchlist</button>
    <button data-tab="alerts" onclick="showTab('alerts')">Meldungen</button>
    <button data-tab="trades" onclick="showTab('trades')">Trades</button>
    <button data-tab="log" onclick="showTab('log')">Log</button>
  </nav>

  <div id="tab-tokens" class="tab">
    <div id="tokens"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div>

  <div id="tab-watchlist" class="tab" hidden>
    <div id="watchlist"><div class="skel"></div></div>
  </div>

  <div id="tab-alerts" class="tab" hidden>
    <div id="alerts"><div class="skel"></div></div>
  </div>

  <div id="tab-trades" class="tab" hidden>
    <div id="trades"><div class="skel"></div></div>
  </div>

  <div id="tab-log" class="tab" hidden>
    <pre class="log" id="log">lade …</pre>
  </div>
</main>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div id="sheet-body"></div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
let tab = 'tokens';
let positions = {};      // Papierpositionen nach Mint
let tradeList = [];      // dieselben als Liste, fuer das Detailblatt
let tokensByMint = {};   // fuer das Detailblatt
let busy = false;
let status = {};

/* ---- Hinweise bei neuen Meldungen -------------------------------------
   Der Browser meldet nur, was seit dem letzten Blick dazugekommen ist.
   Erkannt wird das am Zeitstempel der neuesten Meldung, nicht an ihrer
   Anzahl - sonst gaebe es keine Meldung mehr, sobald der Ringpuffer voll
   ist und alte Eintraege hinten herausfallen.                            */
const BASE_TITLE = 'XENO';
// Ton und Systemmeldung nur bei Anlässen, die eine Unterbrechung wert sind.
// Alles andere steht weiter in der Liste – es klingelt nur nicht. Über hundert
// Meldungen in einer Nacht heißt: keine davon wird gelesen.
const INTERRUPTING = new Set(['call', 'critical_change', 'wake']);
const LOUD = new Set(['critical_change']);
let lastAlertAt = 0;
let primed = false;
let flashTimer = null;
let unseen = 0;

function askNotify() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(updateBell);
}

function updateBell() {
  const bell = document.getElementById('bell');
  bell.hidden = !('Notification' in window) || Notification.permission !== 'default';
}

function beep(loud) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = loud ? 660 : 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (loud ? 0.5 : 0.18));
    osc.start();
    osc.stop(ctx.currentTime + (loud ? 0.52 : 0.2));
    if (loud) setTimeout(() => beep(false), 260);
  } catch (e) { /* Ton ist Beiwerk, kein Grund für einen Fehler */ }
}

function flashTitle() {
  if (flashTimer) return;
  let on = false;
  flashTimer = setInterval(() => {
    on = !on;
    document.title = on ? `(${unseen}) neue Meldung` : BASE_TITLE;
  }, 900);
}

function clearFlash() {
  if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
  unseen = 0;
  document.title = BASE_TITLE;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) clearFlash(); });
window.addEventListener('focus', clearFlash);

function announce(alerts) {
  const newest = alerts.length ? Math.max(...alerts.map(a => a.at)) : 0;
  if (!primed) { primed = true; lastAlertAt = newest; return; }

  const alle = alerts.filter(a => a.at > lastAlertAt);
  lastAlertAt = Math.max(lastAlertAt, newest);
  const fresh = alle.filter(a => INTERRUPTING.has(a.kind));
  if (!fresh.length) return;

  beep(fresh.some(a => LOUD.has(a.kind)));

  if ('Notification' in window && Notification.permission === 'granted') {
    fresh.slice(0, 3).forEach(a => {
      try {
        new Notification(`${a.title}: ${a.symbol || a.mint.slice(0, 10)}`, {
          body: a.lines[0] || '',
          tag: a.mint,
          requireInteraction: LOUD.has(a.kind),
        });
      } catch (e) { /* manche Browser blocken ohne Service Worker */ }
    });
  }

  if (document.hidden) { unseen += fresh.length; flashTitle(); }
}

/* ---- Werkzeug ---------------------------------------------------------- */

function api(path, options = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, options.headers || {});
  if (token) headers['X-Auth-Token'] = token;
  return fetch(path, Object.assign({}, options, {headers})).then(r => {
    if (!r.ok) return r.json().catch(() => ({error: 'HTTP ' + r.status})).then(e => Promise.reject(e.error));
    return r.json();
  });
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(v) {
  if (v == null) return '–';
  if (v >= 1e9) return '$' + (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'k';
  return '$' + (v >= 1 ? Math.round(v) : v.toFixed(2));
}

function usd(v) {
  if (v == null) return '–';
  return (v >= 0 ? '+' : '−') + '$' + Math.abs(v).toFixed(2);
}

function pct(v) { return v == null ? '–' : (v >= 0 ? '+' : '') + v.toFixed(0) + '%'; }

/* Grün bei Plus, rot bei Minus, neutral wenn nichts bekannt ist. Null ist
   hier bewusst kein Minus: eine Position ohne Ergebnis hat keins, sie hat
   keinen Verlust. */
function plCls(v) { return v == null ? '' : (v >= 0 ? 'plus' : 'minus'); }

function num(v) {
  if (v == null) return '–';
  return v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
}

// Ab zwei Tagen in Tagen. Ein etablierter Token stand hier sonst mit
// „31845.6h" — eine Zahl, die niemand liest.
function age(minutes) {
  if (minutes == null) return '–';
  if (minutes < 60) return Math.round(minutes) + 'm';
  if (minutes < 48 * 60) return (minutes / 60).toFixed(1) + 'h';
  return (minutes / 1440).toFixed(minutes < 14400 ? 1 : 0) + 'd';
}

function ago(ts) {
  if (!ts) return 'nie';
  const s = Date.now() / 1000 - ts;
  if (s < 60) return Math.round(s) + 's';
  if (s < 3600) return Math.round(s / 60) + 'min';
  if (s < 86400) return (s / 3600).toFixed(1) + 'h';
  return (s / 86400).toFixed(1) + 'd';
}

function setStat(id, value) {
  const el = document.getElementById(id);
  const next = String(value ?? '–');
  if (el.textContent === next) return;
  el.textContent = next;
  el.classList.remove('bump');
  void el.offsetWidth;          // Neustart der Animation erzwingen
  el.classList.add('bump');
}

/* ---- Sparkline ---------------------------------------------------------
   Aus den ausgeduennten Schlusskursen, die die Strukturanalyse mitliefert.
   Die Farbe kommt aus der Richtung: sie traegt Information, sie ist kein
   Schmuck. Der Endpunkt ist betont, weil das der aktuelle Stand ist.      */

function sparkline(series, animate) {
  if (!series || series.length < 3) return '';
  const w = 300, h = 42, pad = 3;
  const lo = Math.min(...series), hi = Math.max(...series);
  const span = (hi - lo) || 1;
  const x = i => pad + (i / (series.length - 1)) * (w - pad * 2);
  const y = v => pad + (1 - (v - lo) / span) * (h - pad * 2);

  const points = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const line = 'M' + points.join(' L');
  const area = `${line} L${x(series.length - 1).toFixed(1)},${h} L${x(0).toFixed(1)},${h} Z`;
  const rising = series[series.length - 1] >= series[0];
  const colour = rising ? 'var(--ok)' : 'var(--avoid)';
  const last = series.length - 1;

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line class="grid" x1="0" y1="${(h / 2).toFixed(1)}" x2="${w}" y2="${(h / 2).toFixed(1)}"></line>
    <path class="area" d="${area}" fill="${colour}"></path>
    <path class="line${animate ? ' draw' : ''}" d="${line}" stroke="${colour}"></path>
    <circle cx="${x(last).toFixed(1)}" cy="${y(series[last]).toFixed(1)}" fill="${colour}"></circle>
  </svg>`;
}

/* ---- Bausteine ---------------------------------------------------------- */

const TREND_LABEL = { up: 'AUFWÄRTS', down: 'ABWÄRTS', sideways: 'SEITWÄRTS' };
// Meldungsarten, die kein Urteil sind, sondern ein Anlass. Alle übrigen
// zeigen als Plakette einfach das Urteil.
const KIND_BADGE = {
  call: ['CALL', '🎯 CALL'],
  wake: ['WAKE', '📈 AUFGEWACHT'],
};

const GROUP_ORDER = ['CALL', 'OK', 'CAUTION', 'RISKY', 'AVOID', 'UNKNOWN', 'CONTROL'];
// Ein Name je Gruppe, überall derselbe. Intern heißt die Vergleichsgruppe
// CONTROL – angezeigt wird nur „Abgelehnt", sonst stehen für dieselbe Sache
// zwei Wörter auf einer Seite.
const GROUP_LABEL = {
  CALL: 'Calls', OK: 'OK', CAUTION: 'Mittel', RISKY: 'Riskant',
  AVOID: 'Vermeiden', UNKNOWN: 'Unbekannt', CONTROL: 'Abgelehnt',
};

function trendChip(s) {
  if (!s || !TREND_LABEL[s.trend]) return '';
  return `<span class="trend t-${esc(s.trend)}">${TREND_LABEL[s.trend]}</span>`;
}

// Käufe plus Verkäufe. Sind beide unbekannt, ist die Zahl unbekannt – nicht
// null. Vorher stand hier `m.buys_h1 + m.sells_h1`, und bei einer Karte ohne
// Marktdaten ergab `undefined + undefined` ein „NaN" in der Anzeige.
function trades(m) {
  if (m.trade_count_h1 != null) return m.trade_count_h1;
  if (m.buys_h1 == null && m.sells_h1 == null) return null;
  return (m.buys_h1 || 0) + (m.sells_h1 || 0);
}

// Marktdaten stammen aus der letzten Prüfung, nicht von jetzt. Deshalb steht
// das Alter direkt darunter – sonst liest man einen alten Wert als Live-Kurs.
function figures(m, h) {
  const ch = m.price_change_h1_pct;
  const cls = ch == null ? '' : (ch >= 0 ? ' class="up"' : ' class="down"');
  return `<div class="figures">
    <div><b>${money(m.mcap_usd)}</b><span>MCap</span></div>
    <div><b>${money(m.volume_h1_usd)}</b><span>Vol 1h</span></div>
    <div><b>${money(m.liquidity_usd)}</b><span>Liquidität</span></div>
    <div><b${cls}>${pct(ch)}</b><span>1h</span></div>
    <div><b>${num(m.buyers_h1)}</b><span>Käufer</span></div>
    <div><b>${num(trades(m))}</b><span>Trades</span></div>
    <div><b>${h && h.top10_pct != null ? h.top10_pct.toFixed(0) + '%' : '–'}</b><span>Top 10</span></div>
    <div><b>${age(m.age_minutes)}</b><span>Alter</span></div>
  </div>`;
}

/* Seit es die Suche gibt, kann jede Adresse hier landen — auch die eines
   Coins, der seit Jahren läuft. Die Prüfungen sind auf frische Token
   ausgelegt: Zehntausende Wallets sehen dort nach Netzwerk aus, und ein
   Bestand, der sich über Jahre verteilt hat, nach Bundling. Das Urteil
   bleibt trotzdem stehen, wie es ist — es wird nur eingeordnet. */
const ESTABLISHED_MINUTES = 30 * 24 * 60;

function ageWarning(m) {
  if (m.age_minutes == null || m.age_minutes < ESTABLISHED_MINUTES) return '';
  return `<div class="note warn">Dieser Token ist <b>${age(m.age_minutes)}</b> alt.
    XENO prüft auf frische Coins hin — bei etablierten Token schlagen
    Verteilungs- und Netzwerkprüfungen an, ohne dass etwas faul sein muss.
    Das Urteil ist hier <b>kein</b> Rugpull-Verdacht.</div>`;
}

function linkRow(m) {
  const out = [];
  for (const [kind, url] of Object.entries(m.socials || {})) {
    out.push(`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(kind)}</a>`);
  }
  (m.websites || []).forEach(u => out.push(`<a href="${esc(u)}" target="_blank" rel="noopener">web</a>`));
  return out.length ? `<div class="links">${out.join('')}</div>` : '';
}

// Einstieg → jetzt. Ohne den Einstiegswert daneben sagt der aktuelle
// Marktwert nichts darüber, ob die Position läuft.
function positionRow(p) {
  if (!p) return '';
  const cls = plCls(p.result_usd);
  const status = p.open ? '' : ` · ${esc(p.exit_reason)}`;
  return `<div class="pos">
    <span>${money(p.entry_mcap_usd)}</span>
    <span class="arrow">→</span>
    <span>${money(p.current_mcap_usd)}</span>
    <span class="pl ${cls}">${usd(p.result_usd)}${status}</span>
  </div>`;
}

/* Eine Zeile je Token. Das Urteil steckt im Farbstreifen links, damit man
   beim Scrollen nichts lesen muss; der Rest sind die vier Werte, nach
   denen man tatsächlich sucht. Alles Weitere ist einen Tipp entfernt. */
function tokenRow(t) {
  const m = t.market || {};
  const p = positions[t.mint];
  const ch = m.price_change_h1_pct;
  const chCls = ch == null ? '' : (ch >= 0 ? 'up' : 'down');
  const marks = (t.watchlisted ? '<span class="mark">★</span> ' : '')
              + (p && p.open ? '<span class="mark">●</span> ' : '');

  return `<div class="r ${t.watchlisted ? 'wl' : ''}" onclick="openSheet('${esc(t.mint)}')">
    <span class="bar v-${esc(t.verdict)}"></span>
    <span class="r-name">
      <div class="r-sym">${marks}${esc(t.symbol || t.mint.slice(0, 8))}</div>
      <div class="r-sub">${esc(t.verdict)} · vor ${esc(ago(t.last_checked))}</div>
    </span>
    ${sparkline((t.structure || {}).spark, false) || '<span></span>'}
    <span class="r-num">${money(m.mcap_usd)}</span>
    <span class="r-num ${chCls}">${pct(ch)}</span>
    <span class="r-score">${t.score}</span>
  </div>`;
}

/* ---- Filter und Menge ----------------------------------------------------
   Mit neunhundert Token entscheidet nicht das Layout, ob man etwas findet,
   sondern ob man die Menge einschränken kann.                              */

const FILTER_ORDER = ['ALLE', 'OK', 'CAUTION', 'RISKY', 'AVOID', 'UNKNOWN'];
const PAGE = 40;
let filter = 'ALLE';
let shown = PAGE;

function setFilter(name) {
  filter = name;
  shown = PAGE;
  refresh();
}

function showMore() {
  shown += PAGE;
  refresh();
}

function renderList(box, all) {
  // Ausgeblendete laufen im Hintergrund weiter – sie stehen nur nicht in
  // der Liste. Erreichbar bleiben sie über den eigenen Filter.
  const tokens = all.filter(t => !t.hidden);
  const buried = all.length - tokens.length;

  const counts = {ALLE: tokens.length};
  tokens.forEach(t => { counts[t.verdict] = (counts[t.verdict] || 0) + 1; });

  let chips = FILTER_ORDER.filter(n => n === 'ALLE' || counts[n])
    .map(n => `<button class="chip ${filter === n ? 'on' : ''}" onclick="setFilter('${n}')">
      ${n === 'ALLE' ? 'Alle' : (GROUP_LABEL[n] || n)}<b>${counts[n] || 0}</b></button>`).join('');
  if (buried) {
    chips += `<button class="chip ${filter === 'HIDDEN' ? 'on' : ''}"
      onclick="setFilter('HIDDEN')">Ausgeblendet<b>${buried}</b></button>`;
  }

  const list = filter === 'HIDDEN' ? all.filter(t => t.hidden)
             : filter === 'ALLE'   ? tokens
             : tokens.filter(t => t.verdict === filter);
  const page = list.slice(0, shown);
  const rest = list.length - page.length;

  box.innerHTML = `<div class="chips">${chips}</div>`
    + (page.length
        ? `<div class="rows">${page.map(tokenRow).join('')}</div>`
          + (rest ? `<button class="more" onclick="showMore()">weitere ${rest} zeigen</button>` : '')
        : '<div class="empty">Nichts in dieser Gruppe.</div>')
    + (tokens.length > 12 && filter === 'ALLE'
        ? `<button class="more" onclick="hideAll()">Liste leeren —
             ${tokens.length} Token ausblenden</button>`
        : '');
}

/* Ausblenden statt löschen. Der Token wird weiter geprüft, nachverfolgt und
   beim Aufwachen gemeldet — er steht nur nicht mehr in der Liste. Löschen
   würde die Messreihe zerstören, aus der sich überhaupt erst beantworten
   lässt, ob die Urteile etwas taugen. */
function hideAll() {
  if (!confirm('Alle Token aus der Liste nehmen?\n\n'
             + 'Neu gefundene Token erscheinen weiterhin ganz normal — '
             + 'ausgeblendet wird nur, was jetzt schon dasteht.\n\n'
             + 'Die Ausgeblendeten laufen im Hintergrund weiter: werden geprüft, '
             + 'nachverfolgt und melden sich, wenn sie aufwachen. Die Watchlist '
             + 'bleibt.\n\n'
             + 'Zurückholen geht jederzeit über den Filter „Ausgeblendet".')) return;
  api('/api/hide', {method: 'POST', body: JSON.stringify({all: true})})
    .then(() => { shown = PAGE; refresh(); })
    .catch(err => alert('Fehler: ' + err));
}

function hideOne(mint) {
  api('/api/hide', {method: 'POST', body: JSON.stringify({mint})})
    .then(() => { closeSheet(); refresh(); })
    .catch(err => alert('Fehler: ' + err));
}

function unhide(mint) {
  api('/api/hide/' + encodeURIComponent(mint), {method: 'DELETE'})
    .then(() => { closeSheet(); refresh(); })
    .catch(err => alert('Fehler: ' + err));
}

/* ---- Detailblatt --------------------------------------------------------- */

function openSheet(mint) {
  const t = tokensByMint[mint];
  if (!t) return;
  const m = t.market || {};
  const p = positions[mint];
  const groups = [['critical', 'Kritisch'], ['high', 'Schwer'], ['medium', 'Mittel'],
                  ['low', 'Gering'], ['info', 'Unauffällig']];

  api('/api/token/' + encodeURIComponent(mint)).then(d => {
    const all = (d.report && d.report.findings) || t.top_findings || [];
    // Was während der Prüfung schiefging. Stand bisher nur im Bericht und
    // wurde nie angezeigt – bei einem „Unbekannt" sah man das Ergebnis,
    // aber nirgends den Grund dafür.
    const errors = (d.report && d.report.errors) || [];
    const why = errors.length
      ? `<h3>Was nicht geprüft werden konnte</h3>` + errors.map(e =>
          `<div class="finding high">${esc(e)}</div>`).join('')
      : '';
    const blocks = groups.map(([sev, label]) => {
      const list = all.filter(f => f.severity === sev);
      if (!list.length) return '';
      return `<h3>${label}</h3>` + list.map(f =>
        `<div class="finding ${esc(f.severity)}">${esc(f.message)}</div>`).join('');
    }).join('');

    document.getElementById('sheet-body').innerHTML = `
      <div class="card-head">
        <span class="badge b-${esc(t.verdict)}">${esc(t.verdict)}</span>
        <h2 class="sym">${esc(t.symbol || mint.slice(0, 10))}${trendChip(t.structure)}</h2>
        <span class="score">${t.score}/100</span>
      </div>
      ${sparkline((t.structure || {}).spark, true)}
      ${figures(m, t.holders)}
      ${ageWarning(m)}
      ${why}
      ${p ? '<h3>Papierposition</h3>' + positionRow(p) : ''}
      ${linkRow(m)}
      ${blocks || '<h3>Befunde</h3><div class="finding info">keine</div>'}
      <h3>Mint</h3>
      <div class="mint">${esc(mint)}</div>
      <div class="card-actions">
        ${t.watchlisted
          ? `<button class="danger" onclick="removeWatch('${esc(mint)}')">Entfernen</button>`
          : `<button onclick="addWatch('${esc(mint)}')">Beobachten</button>`}
        ${t.hidden
          ? `<button onclick="unhide('${esc(mint)}')">Wieder zeigen</button>`
          : `<button onclick="hideOne('${esc(mint)}')">Ausblenden</button>`}
        <button onclick="runCheck('${esc(mint)}')">Neu prüfen</button>
        <button onclick="window.open('https://dexscreener.com/solana/${esc(mint)}','_blank')">Chart</button>
        <button onclick="closeSheet()">Schließen</button>
      </div>`;
    showSheet();
  }).catch(() => {});
}

function showSheet() {
  document.getElementById('sheet').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('sheet').scrollTop = 0;
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---- Suche ----------------------------------------------------------------
   Zwei Wege in dieselbe Prüfung: eine Mint-Adresse geht direkt hinein, ein
   Name erst durch die Trefferliste. Der Umweg ist bei Namen unvermeidlich -
   "bonk" gibt es ein Dutzend Mal, und der falsche davon ist genau der, den
   jemand kaufen soll.                                                        */

const MINT_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;

function lookup() {
  const field = document.getElementById('q');
  const value = field.value.trim();
  if (!value || busy) return;
  if (MINT_RE.test(value)) { field.value = ''; return runCheck(value); }

  const btn = document.getElementById('go');
  busy = true;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  api('/api/search?q=' + encodeURIComponent(value))
    .then(d => { field.value = ''; openHits(d); })
    .catch(err => alert('Suche fehlgeschlagen: ' + err))
    .finally(() => { busy = false; btn.disabled = false; btn.textContent = 'Prüfen'; });
}

function openHits(d) {
  const list = d.matches || [];
  document.getElementById('sheet-body').innerHTML = `
    <h2 class="sym">${list.length} Treffer für „${esc(d.query)}"</h2>
    ${list.length > 1 ? `<div class="note">Denselben Namen trägt jeder, der ihn
        sich nimmt. Was den Coin eindeutig macht, ist die Adresse darunter.
        Oben steht der mit dem meisten Umsatz — nicht der mit dem größten
        Pool: eine große Zahl im Pool kostet nichts, gehandelt werden muss
        wirklich.</div>` : ''}
    ${list.length ? '' : `<div class="empty">Nichts gefunden.<br>
        Mit der Mint-Adresse klappt es sicher — den Namen kennt nur,
        wer schon einen Pool hat.</div>`}
    ${list.map((h, i) => `<div class="card tappable in"
         style="animation-delay:${Math.min(i, 8) * 34}ms"
         onclick="runCheck('${esc(h.mint)}')">
      <div class="card-head">
        <span class="sym">${esc(h.symbol || h.mint.slice(0, 10))}</span>
        <span class="hit-state">${h.checked ? 'geprüft' : 'prüfen →'}</span>
      </div>
      ${h.name && h.name !== h.symbol ? `<div class="hit-name">${esc(h.name)}</div>` : ''}
      ${figures(h.market || {}, {})}
      <div class="mint">${esc(h.mint)}</div>
    </div>`).join('')}
    <div class="card-actions"><button onclick="closeSheet()">Schließen</button></div>`;
  showSheet();
}

/* ---- Reiter und Status ---------------------------------------------------- */

function showTab(name) {
  tab = name;
  document.querySelectorAll('.tab').forEach(el => el.hidden = el.id !== 'tab-' + name);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  refresh();
}

// Der Ring laeuft lokal weiter, damit er sich fluessig bewegt statt im
// Fuenf-Sekunden-Takt der Abfrage zu springen.
function paintRing() {
  const circle = document.querySelector('#ring .fg');
  if (!status.running || !status.interval) { circle.style.strokeDashoffset = 94.2; return; }
  const since = status.last_cycle_at ? (Date.now() / 1000 - status.last_cycle_at) : 0;
  const done = Math.max(0, Math.min(1, since / status.interval));
  circle.style.strokeDashoffset = (94.2 * (1 - done)).toFixed(1);
}

function renderStatus(s) {
  status = s;
  document.getElementById('pulse').className = 'pulse' + (s.running && !s.stopping ? ' on' : '');
  const btn = document.getElementById('toggle');
  if (!btn.disabled) btn.textContent = s.running ? 'Stopp' : 'Start';

  const bits = [];
  if (s.stopping) bits.push('hält an');
  else if (s.running) bits.push(`läuft · <span class="num">${s.cycles}</span> Durchläufe`);
  else bits.push('gestoppt');
  if (s.profile) bits.push(esc(s.profile.name));
  if (s.live && s.live.running) bits.push(`live <span class="num">${s.live.received}</span>`);
  if (s.credits && s.credits.monthly_cap) {
    const left = s.credits.remaining_today;
    bits.push(`<span class="num">${left.toLocaleString('de')}</span> Credits heute`);
  }
  document.getElementById('sub').innerHTML = bits.join(' · ');
  paintRing();

  setStat('s-checked', s.checked_total);
  setStat('s-wl', s.watchlist);
  setStat('s-alerts', s.alerts);

  const notes = [];
  if (s.uses_public_rpc) {
    notes.push(`<div class="note warn">Öffentlicher RPC aktiv — Holder-Daten kommen von RugCheck.
      Für eigene Chain-Abfrage einen RPC-Zugang in die <b>.env</b> eintragen.</div>`);
  }
  if (!s.running && s.cycles === 0) {
    notes.push(`<div class="note">Der Watcher läuft noch nicht. Oben auf <b>Start</b> tippen —
      danach sucht er laufend nach neuen Token.</div>`);
  }
  if (s.credits && s.credits.denied_today) {
    notes.push(`<div class="note warn">Tagesbudget erreicht — <b>${s.credits.denied_today}</b>
      Abfragen ausgelassen. Die betroffenen Prüfungen melden Wissenslücken.</div>`);
  }
  document.getElementById('notes').innerHTML = notes.join('');
}

/* ---- Trades ---------------------------------------------------------------- */

function renderTrades(d) {
  const box = document.getElementById('trades');
  if (!d.available) { box.innerHTML = '<div class="empty">Papierhandel nicht aktiv.</div>'; return; }
  const t = d.total || {};
  if (!t.closed && !t.open) {
    box.innerHTML = `<div class="empty">Noch keine Positionen.<br>
      Der Bot simuliert jeden geprüften Token — nach ein paar Durchläufen steht hier etwas.</div>`;
    return;
  }

  const groups = d.groups || {};
  const rows = GROUP_ORDER.filter(g => groups[g]).map(g => [g, groups[g]]);
  const closedRows = rows.filter(([, s]) => s.closed > 0);

  /* Verglichen wird pro Trade, nicht nach Gesamtsumme — und erst ab MIN_N.
     Beides an echten Zahlen aufgefallen: „Am besten gelaufen: Unbekannt"
     stand über 14 Trades mit −$8.65, während Abgelehnt mit 353 Trades bei
     −$12.653 lag. Pro Trade war Unbekannt damit nicht die beste Gruppe,
     sondern nur die kleinste. Eine Auswertung, die die Fallzahl ignoriert,
     kürt zuverlässig die Gruppe, in der am wenigsten passiert ist. */
  const MIN_N = 30;
  const perTrade = s => s.result_usd / s.closed;
  const ranked = closedRows.filter(([, s]) => s.closed >= MIN_N);
  const best = ranked.length
    ? ranked.reduce((a, b) => (perTrade(b[1]) > perTrade(a[1]) ? b : a))[0]
    : null;
  const zuKlein = closedRows.length - ranked.length;

  /* Ob der gemessene Rückweg teurer ist als der geschätzte. Erst ab MIN_N
     Messungen eine Aussage — darunter ist es eine Stichprobe von Zufall. */
  const teurer = t.measured_retention != null && d.default_retention != null
    && t.measured >= MIN_N && t.measured_retention < d.default_retention - 0.01;

  box.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${t.closed}</b><span>Abgeschl.</span></div>
      <div class="stat"><b>${t.open}</b><span>Offen</span></div>
      <div class="stat"><b>$${(t.turnover_usd || 0).toFixed(0)}</b><span>Umsatz</span></div>
      <div class="stat"><b class="${plCls(t.result_usd)}">${usd(t.result_usd)}</b><span>Ergebnis</span></div>
    </div>

    <div class="note">100 $ je Token, raus bei 2x, −40 % oder nach 24 h. Kein echtes Geld.
      <b>Abgelehnt</b> = vom Vorfilter aussortiert, drei zufällige je Durchlauf. Das ist
      der Maßstab: laufen sie besser, filtert der Bot falsch.</div>

    ${t.costs_usd ? `<div class="note">Das Ergebnis ist <b>nach Kosten</b>. Ohne sie
      stünden hier ${usd(t.gross_result_usd)} — der Handel selbst kostete
      <b>$${t.costs_usd.toFixed(2)}</b>${t.invested_usd
        ? ' (' + (t.costs_usd / t.invested_usd * 100).toFixed(1) + ' % vom Einsatz)' : ''},
      davon $${(t.fees_usd || 0).toFixed(2)} Netzgebühren, der Rest Swap-Weg.
      Vom Einsatz überleben Kauf und Verkauf im Schnitt
      <b>${((t.avg_retention == null ? 1 : t.avg_retention) * 100).toFixed(1)} %</b> —
      bei ${t.measured || 0} von ${(t.closed || 0) + (t.open || 0)} Positionen gemessen,
      sonst geschätzt.</div>` : ''}

    ${t.measured_retention != null && d.default_retention != null ? `<div class="note ${
      teurer ? 'warn' : ''}">
      Nur die <b>gemessenen</b> Positionen: Median
      <b>${(t.measured_retention * 100).toFixed(1)} %</b> überleben den Rückweg,
      geschätzt wird mit ${(d.default_retention * 100).toFixed(1)} %.
      ${teurer
        ? `Gemessen ist der Handel also <b>teurer</b> als geschätzt — die Bilanz oben
           ist damit eher zu freundlich, und zwar genau bei den abgelehnten Token,
           zu denen es nie eine Messung gibt.`
        : `Beide Zahlen liegen beieinander — die Schätzung trägt.`}</div>` : ''}

    <div class="wrap-x"><table class="trades">
      <tr><th>Gruppe</th><th>Trades</th><th>Im Plus</th><th>Median</th><th>Ergebnis</th><th>pro Trade</th></tr>
      ${rows.map(([g, s]) => {
        const klein = s.closed > 0 && s.closed < MIN_N;
        return `<tr class="${g === best ? 'best' : ''}${klein ? ' thin' : ''}">
        <td class="grp"><span class="badge b-${g}">${GROUP_LABEL[g] || g}</span></td>
        <td>${s.closed}${s.open ? ' <span style="color:var(--muted)">+' + s.open + '</span>' : ''}</td>
        <td>${s.closed ? s.win_rate.toFixed(0) + '%' : '–'}</td>
        <td>${s.median_multiple != null ? s.median_multiple.toFixed(2) + 'x' : '–'}</td>
        <td class="${plCls(s.result_usd)}">${s.closed ? usd(s.result_usd) : '–'}</td>
        <td class="${plCls(s.result_usd)}">${s.closed ? usd(perTrade(s)) : '–'}</td>
      </tr>`;}).join('')}
    </table></div>

    ${best ? `<div class="note" style="margin-top:12px">Am besten gelaufen:
      <b>${GROUP_LABEL[best] || best}</b> — gerechnet <b>pro Trade</b>, nicht nach
      Gesamtsumme. Sonst gewinnt zuverlässig die Gruppe, in der am wenigsten
      passiert ist. Steht dort „Vermeiden" oder „Abgelehnt", filtert der Bot in die
      falsche Richtung.${zuKlein ? ` ${zuKlein} Gruppe${zuKlein > 1 ? 'n' : ''} mit
      unter ${MIN_N} Trades ${zuKlein > 1 ? 'sind' : 'ist'} blass markiert und zählt
      hier nicht mit — zu wenig, um etwas zu bedeuten.` : ''}</div>`
      : `<div class="note" style="margin-top:12px">Noch keine Gruppe mit
      ${MIN_N} abgeschlossenen Trades. Bis dahin ist jeder Vergleich Zufall.</div>`}

    <h3 class="sec">Positionen</h3>
    <div class="rows">${tradeList.map(posRow).join('')}</div>`;
}

/* ---- Eine Position im Detail ----------------------------------------------
   Die Zeile sagt, ob es läuft. Hier steht, warum: der Einstieg mit seiner
   Begründung, der Spitzenkurs (was ein besserer Ausstieg gebracht hätte)
   und die Regel, die den Ausstieg entschieden hat.                          */

/* Die Regel löst bei 2x aus — verkauft wird zu dem Kurs, der beim
   Nachsehen dasteht. Springt der Kurs zwischen zwei Abfragen, liegt der
   auch mal deutlich darüber. „Bei 2x verkauft" wäre deshalb falsch: es
   stand schon ein Fall mit 3.14x daneben. */
const EXIT_LABEL = {
  ziel: 'Gewinnziel ausgelöst — Regel greift ab 2x',
  verlustgrenze: 'Verlustgrenze ausgelöst — Regel greift ab −40 %',
  zeit: 'Zeit abgelaufen — nach 24 Stunden verkauft',
  markt_weg: 'Markt verschwunden — Totalverlust',
};

function openTrade(i) {
  const p = tradeList[i];
  if (!p) return;
  const cls = plCls(p.result_usd);
  // Gerechnet wird mit dem gedeckelten Vielfachen — sonst schriebe sich die
  // Simulation Ausführungen gut, die es bei diesen Liquiditäten nicht gibt.
  const used = p.credited_multiple != null ? p.credited_multiple : p.multiple;
  const pct = used == null ? null : (used - 1) * 100;
  const gedeckelt = p.multiple != null && used != null && p.multiple > used + 0.01;

  document.getElementById('sheet-body').innerHTML = `
    <div class="card-head">
      <span class="badge b-${esc(p.group)}">${esc(GROUP_LABEL[p.group] || p.group)}</span>
      <h2 class="sym">${p.is_call ? '🎯 ' : ''}${esc(p.symbol || p.mint.slice(0, 10))}</h2>
      <span class="score">${p.open ? 'offen' : 'zu'}</span>
    </div>

    <div class="stats" style="margin-top:12px">
      <div class="stat"><b>${money(p.entry_mcap_usd)}</b><span>Einstieg</span></div>
      <div class="stat"><b>${money(p.current_mcap_usd)}</b><span>${p.open ? 'jetzt' : 'Ausstieg'}</span></div>
      <div class="stat"><b class="${cls}">${usd(p.result_usd)}</b><span>Ergebnis</span></div>
      <div class="stat"><b class="${cls}">${pct == null ? '–' : (pct >= 0 ? '+' : '') + pct.toFixed(0) + '%'}</b><span>Veränderung</span></div>
    </div>

    <h3>Verlauf</h3>
    <div class="figures">
      <div><b>${money(p.size_usd)}</b><span>Einsatz</span></div>
      <div><b>${money(p.peak_mcap_usd)}</b><span>Höchststand</span></div>
      <div><b>${p.peak_multiple == null ? '–' : p.peak_multiple.toFixed(2) + 'x'}</b><span>Spitze</span></div>
      <div><b>${esc(ago(p.opened_at))}</b><span>gekauft vor</span></div>
    </div>
    ${gedeckelt ? `<div class="note">Der Kurs stand beim Nachsehen bei
      <b>${p.multiple.toFixed(1)}x</b> — gerechnet wird trotzdem mit
      <b>${used.toFixed(1)}x</b>. Die Regel verkauft bei 2x; alles darüber ist
      ein Sprung zwischen zwei Abfragen, und den zahlt bei ein paar tausend
      Dollar Liquidität kein Orderbuch aus. Nach unten wird nicht gedeckelt —
      dort ist derselbe Effekt real.</div>` : ''}
    ${!gedeckelt && !p.open && p.peak_multiple != null && p.multiple != null
       && p.peak_multiple > p.multiple * 1.15 ? `<div class="note">
      In der Spitze stand die Position bei <b>${p.peak_multiple.toFixed(1)}x</b>,
      verkauft wurde bei <b>${p.multiple.toFixed(1)}x</b>. Die Regel lässt hier
      etwas liegen — dafür greift sie auch nach unten.</div>` : ''}

    <h3>Was der Handel kostet</h3>
    <div class="figures">
      <div><b class="${plCls(p.gross_result_usd)}">${usd(p.gross_result_usd)}</b><span>nur Kurs</span></div>
      <div><b class="minus">${p.cost_usd == null ? '–' : '−$' + p.cost_usd.toFixed(2)}</b><span>Kosten</span></div>
      <div><b>${((1 - p.retention) * 100).toFixed(1)} %</b><span>Swap-Weg</span></div>
      <div><b>$${(p.fee_usd || 0).toFixed(2)}</b><span>Gebühren</span></div>
    </div>
    <div class="note">${p.retention_measured
      ? `Der Swap-Weg ist <b>gemessen</b>: Jupiter wurde beim Einstieg gefragt, was ein
         sofortiger Kauf und Verkauf übrig ließe — <b>${(p.retention * 100).toFixed(1)} %</b>
         vom Einsatz. Darin stecken Swap-Gebühr und Preiseinfluss. Gemessen wurde mit
         0,1 SOL, gehandelt werden 100 $; bei der größeren Order ist der Preiseinfluss
         eher höher.`
      : `Der Swap-Weg ist <b>geschätzt</b> (${(p.retention * 100).toFixed(1)} %). Zu diesem
         Token liegt keine eigene Messung vor — abgelehnte Token werden nie tief geprüft.
         Der Wert ist der Median aus neun gemessenen Token.`}
      Die Netzgebühr ist in beiden Fällen eine Annahme: rund 0,001 SOL je Transaktion,
      zweimal.</div>

    <h3>${p.open ? 'Ausstiegsregel' : 'Ausstieg'}</h3>
    ${p.open
      ? `<div class="finding info">Verkauft wird bei 2x, bei −40 % oder nach 24 Stunden —
           je nachdem, was zuerst eintritt.</div>`
      : `<div class="finding info">${esc(EXIT_LABEL[p.exit_reason] || p.exit_reason || 'unbekannt')}
         </div><div class="finding info">geschlossen vor ${esc(ago(p.closed_at))}</div>`}

    ${(p.reasons || []).length ? '<h3>Warum gekauft</h3>'
      + p.reasons.map(r => `<div class="finding info">${esc(r)}</div>`).join('') : ''}

    <h3>Mint</h3>
    <div class="mint">${esc(p.mint)}</div>
    <div class="card-actions">
      ${tokensByMint[p.mint] ? `<button onclick="openSheet('${esc(p.mint)}')">Token-Bericht</button>` : ''}
      <button onclick="window.open('https://dexscreener.com/solana/${esc(p.mint)}','_blank')">Chart</button>
      <button onclick="closeSheet()">Schließen</button>
    </div>`;
  showSheet();
}

/* Auch hier eine Zeile statt einer Karte. Einstieg → jetzt steht direkt
   neben dem Ergebnis: ohne den Einstiegswert sagt der aktuelle Marktwert
   nichts darüber, ob die Position läuft. */
function posRow(p, i) {
  const cls = plCls(p.result_usd);
  return `<div class="r" onclick="openTrade(${i})">
    <span class="bar v-${esc(p.group)}"></span>
    <span class="r-name">
      <div class="r-sym">${p.is_call ? '<span class="mark">🎯</span> ' : ''}${
        esc(p.symbol || p.mint.slice(0, 8))}</div>
      <div class="r-sub">${esc(GROUP_LABEL[p.group] || p.group)} · ${
        p.open ? 'offen seit ' + esc(ago(p.opened_at)) : esc(p.exit_reason)}</div>
    </span>
    <span class="r-num">${money(p.entry_mcap_usd)}</span>
    <span class="r-num">${money(p.current_mcap_usd)}</span>
    <span class="r-num ${cls}" style="grid-column:span 2">${usd(p.result_usd)}</span>
  </div>`;
}

/* ---- Abfrageschleife -------------------------------------------------------- */

/* Ein fehlender Token sah bisher aus wie ein kaputter Bot: die Seite lud,
   blieb aber komplett leer, und die einzige Erklärung stand als graue
   Kleinschrift oben in der Ecke. Das ist der häufigste Fall beim Zugriff
   vom Handy — und der einzige, den man selbst beheben kann, wenn man
   erfährt wie.                                                            */
function tokenHelp() {
  document.getElementById('notes').innerHTML = `<div class="note warn">
    <b>Der Link braucht den Token.</b><br>
    Am PC steht er beim Start hinter der Adresse — der ganze Link, mit
    <b>?token=…</b> am Ende. Oder hier einfügen:
    <div class="row" style="margin-top:9px">
      <input id="tok" placeholder="Token einfügen" autocapitalize="off"
             autocorrect="off" spellcheck="false">
      <button class="primary" onclick="useToken()">Verbinden</button>
    </div></div>`;
  ['tokens', 'watchlist', 'alerts', 'trades'].forEach(id => {
    const box = document.getElementById(id);
    if (box) box.innerHTML = '';
  });
}

function useToken() {
  const value = document.getElementById('tok').value.trim();
  if (value) location.search = '?token=' + encodeURIComponent(value);
}

function refresh() {
  api('/api/status').then(renderStatus).catch(err => {
    document.getElementById('sub').textContent = 'keine Verbindung: ' + err;
    if (String(err).toLowerCase().includes('token')) tokenHelp();
  });

  if (tab === 'tokens' || tab === 'watchlist') {
    api('/api/tokens').then(d => {
      tokensByMint = {};
      d.tokens.forEach(t => { tokensByMint[t.mint] = t; });
      setStat('s-tokens', d.tokens.length);

      const all = d.tokens.filter(t => t.check_count > 0);
      const box = document.getElementById('tokens');
      if (all.length) renderList(box, all);
      else box.innerHTML = `<div class="empty">Noch nichts geprüft.<br>
             Watcher starten — oder oben eine Mint-Adresse einfügen.</div>`;

      const wl = d.tokens.filter(t => t.watchlisted);
      document.getElementById('watchlist').innerHTML = wl.length
        ? `<div class="rows">${wl.map(tokenRow).join('')}</div>`
        : `<div class="empty">Watchlist ist leer.<br>
             Oben einen Token suchen und im Detail auf <b>Beobachten</b> tippen.</div>`;
    }).catch(() => {});
  }

  // Immer abfragen, nicht nur im Meldungs-Tab: sonst gäbe es keinen
  // Hinweis, während man auf der Tokenliste steht.
  api('/api/alerts').then(d => {
    announce(d.alerts);
    if (tab === 'alerts') {
      document.getElementById('alerts').innerHTML = d.alerts.length
        ? d.alerts.map((a, i) => `<div class="card in v-${esc(a.verdict)}"
              style="animation-delay:${Math.min(i, 8) * 34}ms">
            <div class="card-head">
              <span class="badge b-${KIND_BADGE[a.kind] ? KIND_BADGE[a.kind][0] : esc(a.verdict)}">${
                KIND_BADGE[a.kind] ? KIND_BADGE[a.kind][1] : esc(a.verdict)}</span>
              <span class="sym">${esc(a.symbol || a.mint.slice(0, 10))}${trendChip(a.structure)}</span>
              <span class="score">${ago(a.at)}</span>
            </div>
            ${sparkline((a.structure || {}).spark, false)}
            ${a.lines.slice(1).map(l => `<div class="finding info">${esc(l)}</div>`).join('')}
          </div>`).join('')
        : '<div class="empty">Noch keine Meldungen.</div>';
    }
  }).catch(() => {});

  // Immer holen, nicht nur im Trades-Tab: die Tokenkarten zeigen die
  // offenen Positionen mit an.
  api('/api/trades').then(d => {
    positions = {};
    tradeList = (d.positions || []).slice(0, 50);
    (d.positions || []).forEach(p => { if (!positions[p.mint]) positions[p.mint] = p; });
    if (tab === 'trades') renderTrades(d);
  }).catch(() => {});

  if (tab === 'log') {
    api('/api/log').then(d => {
      document.getElementById('log').textContent = d.lines.slice().reverse().join('\n') || 'leer';
    }).catch(() => {});
  }
}

/* ---- Aktionen ---------------------------------------------------------------- */

function toggleWatcher() {
  const btn = document.getElementById('toggle');
  const starting = btn.textContent === 'Start';
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  api('/api/watcher/' + (starting ? 'start' : 'stop'), {method: 'POST', body: '{}'})
    .then(renderStatus)
    .catch(err => alert('Fehler: ' + err))
    .finally(() => { btn.disabled = false; refresh(); });
}

function addWatch(mint) {
  if (!mint) return;
  api('/api/watchlist', {method: 'POST', body: JSON.stringify({mint})})
    .then(() => { closeSheet(); refresh(); })
    .catch(err => alert('Fehler: ' + err));
}

function removeWatch(mint) {
  api('/api/watchlist/' + encodeURIComponent(mint), {method: 'DELETE'})
    .then(() => { closeSheet(); refresh(); })
    .catch(err => alert('Fehler: ' + err));
}

function runCheck(mint) {
  if (busy) return;
  busy = true;
  closeSheet();
  const sub = document.getElementById('sub');
  const previous = sub.innerHTML;
  sub.innerHTML = '<span class="spin"></span> prüfe ' + esc(mint.slice(0, 10)) + ' …';
  api('/api/check', {method: 'POST', body: JSON.stringify({mint})})
    .then(r => {
      // Der Bericht kommt vollständig zurück. Ihn gleich einzusortieren
      // spart das Warten auf den nächsten Abruf der Tokenliste — und vor
      // allem zeigt das Detailblatt jetzt den ganzen Befund statt eines
      // Meldungsfensters mit zwei Zahlen darin.
      tokensByMint[r.mint] = Object.assign({}, tokensByMint[r.mint], {
        mint: r.mint,
        symbol: r.symbol,
        verdict: r.verdict,
        score: r.score,
        market: r.market,
        holders: r.holders,
        structure: r.structure,
        top_findings: r.findings,
        last_checked: Date.now() / 1000,
      });
      openSheet(r.mint);
    })
    .catch(err => alert('Fehler: ' + err))
    .finally(() => { busy = false; sub.innerHTML = previous; refresh(); });
}

updateBell();
refresh();
setInterval(refresh, 5000);
setInterval(paintRing, 1000);
</script>
