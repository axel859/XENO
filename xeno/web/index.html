<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>XENO</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --panel-2: #1a1f26;
    --line: #262d36;
    --text: #e6eaef;
    --muted: #8b95a3;
    --ok: #35d07f;
    --caution: #e8b339;
    --risky: #f08a3c;
    --avoid: #ef4a5a;
    --unknown: #6b7683;
    --accent: #4aa3ef;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11,13,16,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-top)) 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: .08em; font-weight: 700; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--unknown); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(53,208,127,.16); }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }

  main { padding: 14px 16px 90px; max-width: 780px; margin: 0 auto; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 9px 14px; border-radius: 9px; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06121e; font-weight: 600; }
  button.danger { background: transparent; border-color: var(--avoid); color: var(--avoid); }
  button:disabled { opacity: .45; }

  input {
    font: inherit; font-size: 15px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 10px 12px; border-radius: 9px; width: 100%;
  }
  input::placeholder { color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 10px 8px; text-align: center; }
  .stat b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }

  nav { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 11px; padding: 4px; margin-bottom: 14px; }
  nav button { flex: 1; background: transparent; border: none; padding: 9px 4px; font-size: 13.5px; color: var(--muted); }
  nav button.active { background: var(--panel-2); color: var(--text); font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 13px 14px; margin-bottom: 9px; }
  .card.wl { border-left: 3px solid var(--accent); }
  .card-head { display: flex; align-items: center; gap: 9px; }
  .badge { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; padding: 3px 8px;
           border-radius: 6px; flex: none; }
  .OK      { background: rgba(53,208,127,.16); color: var(--ok); }
  .CAUTION { background: rgba(232,179,57,.16); color: var(--caution); }
  .RISKY   { background: rgba(240,138,60,.16); color: var(--risky); }
  .AVOID   { background: rgba(239,74,90,.16); color: var(--avoid); }
  .UNKNOWN { background: rgba(107,118,131,.16); color: var(--unknown); }
  /* Vergleichsgruppe: bewusst unauffaellig - sie ist kein Urteil, sondern
     die Stichprobe, gegen die geprueft wird. */
  .CONTROL { background: rgba(107,118,131,.10); color: var(--muted); }
  .CALL    { background: rgba(74,163,239,.16); color: var(--accent); }
  .sym { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; flex: none; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

  /* Marktdaten: Raster statt Fliesstext, damit man beim Vergleichen zweier
     Karten die Werte untereinander findet. */
  .figures { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 8px; margin-top: 9px; }
  .figures div { min-width: 0; }
  .figures b { display: block; font-size: 13.5px; font-weight: 600; color: var(--text);
               font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  .figures span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .figures .up { color: var(--ok); }
  .figures .down { color: var(--avoid); }
  /* Ohne Zeitstempel liest sich eine 40 Minuten alte Zahl wie ein Live-Kurs. */
  .asof { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .trend { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
           padding: 2px 7px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; }
  .trend-up       { background: rgba(53,208,127,.16); color: var(--ok); }
  .trend-down     { background: rgba(239,74,90,.16);  color: var(--avoid); }
  .trend-sideways { background: rgba(107,118,131,.16); color: var(--unknown); }
  .links { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .links a { font-size: 11.5px; color: var(--accent); text-decoration: none;
             border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }

  /* Papierhandel: Einstieg → jetzt, und was dabei herauskommt. */
  .pos { display: flex; align-items: baseline; gap: 8px; margin-top: 8px;
         padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12.5px; }
  .pos .arrow { color: var(--muted); }
  .pos .pl { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
  .plus { color: var(--ok); }
  .minus { color: var(--avoid); }

  table.trades { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.trades th { text-align: right; color: var(--muted); font-weight: 500;
                    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
                    padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.trades th:first-child, table.trades td:first-child { text-align: left; }
  table.trades td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--line-soft, #1b2027);
                    font-variant-numeric: tabular-nums; }
  table.trades tr.best td { background: rgba(53,208,127,.07); }
  .grp { font-weight: 600; }
  .grp.CALL { color: var(--accent); }
  .wrap-x { overflow-x: auto; }
  .finding { font-size: 12.5px; margin-top: 5px; padding-left: 15px; position: relative; color: #c3cbd6; }
  .finding::before { content: ""; position: absolute; left: 3px; top: 7px; width: 5px; height: 5px; border-radius: 50%; }
  .finding.critical::before, .finding.high::before { background: var(--avoid); }
  .finding.medium::before { background: var(--caution); }
  .finding.low::before, .finding.info::before { background: var(--unknown); }
  .mint { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
          color: var(--muted); margin-top: 8px; word-break: break-all; }
  .card-actions { display: flex; gap: 7px; margin-top: 10px; }
  .card-actions button { padding: 6px 11px; font-size: 12.5px; }

  .empty { color: var(--muted); text-align: center; padding: 42px 20px; font-size: 14px; }
  .note { background: rgba(74,163,239,.09); border: 1px solid rgba(74,163,239,.28);
          border-radius: 10px; padding: 11px 13px; font-size: 12.5px; color: #b8d4ef; margin-bottom: 14px; }
  .warn { background: rgba(232,179,57,.09); border-color: rgba(232,179,57,.28); color: #e8cf9a; }

  .alert-kind { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .kind-new { color: var(--ok); }
  .kind-critical_change { color: var(--avoid); }
  .kind-degraded { color: var(--risky); }
  .kind-improved { color: var(--accent); }
  .when { color: var(--muted); font-size: 11.5px; float: right; }

  pre.log { background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
            padding: 12px; font-size: 11.5px; color: var(--muted); overflow-x: auto;
            white-space: pre-wrap; word-break: break-word; margin: 0; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
          border-top-color: var(--accent); border-radius: 50%; animation: r .7s linear infinite;
          vertical-align: -1px; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="dot"></span>
    <h1>XENO</h1>
    <button id="bell" hidden onclick="askNotify()" title="Benachrichtigungen erlauben">🔔</button>
    <button id="toggle" style="margin-left:auto" onclick="toggleWatcher()">…</button>
  </div>
  <div class="sub" id="sub">verbinde …</div>
</header>

<main>
  <div id="notes"></div>

  <div class="stats">
    <div class="stat"><b id="s-checked">–</b><span>Geprüft</span></div>
    <div class="stat"><b id="s-tokens">–</b><span>Token</span></div>
    <div class="stat"><b id="s-wl">–</b><span>Watchlist</span></div>
    <div class="stat"><b id="s-alerts">–</b><span>Meldungen</span></div>
  </div>

  <nav>
    <button class="active" data-tab="tokens" onclick="showTab('tokens')">Token</button>
    <button data-tab="watchlist" onclick="showTab('watchlist')">Watchlist</button>
    <button data-tab="alerts" onclick="showTab('alerts')">Meldungen</button>
    <button data-tab="trades" onclick="showTab('trades')">Trades</button>
    <button data-tab="log" onclick="showTab('log')">Log</button>
  </nav>

  <div id="tab-tokens" class="tab">
    <div id="tokens"><div class="empty">lade …</div></div>
  </div>

  <div id="tab-watchlist" class="tab" hidden>
    <div class="row" style="margin-bottom:12px">
      <input id="mint" placeholder="Mint-Adresse einfügen" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="primary" onclick="addWatch()">Beobachten</button>
      <button onclick="checkNow()">Jetzt prüfen</button>
    </div>
    <div id="watchlist"><div class="empty">lade …</div></div>
  </div>

  <div id="tab-alerts" class="tab" hidden>
    <div id="alerts"><div class="empty">lade …</div></div>
  </div>

  <div id="tab-trades" class="tab" hidden>
    <div id="trades"><div class="empty">lade …</div></div>
  </div>

  <div id="tab-log" class="tab" hidden>
    <pre class="log" id="log">lade …</pre>
  </div>
</main>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
let tab = 'tokens';
// Papierpositionen nach Mint, damit die Tokenkarten sie mitzeigen können.
let positions = {};
let busy = false;

/* ---- Hinweise bei neuen Meldungen -------------------------------------
   Der Browser meldet nur, was seit dem letzten Blick dazugekommen ist.
   Erkannt wird das am Zeitstempel der neuesten Meldung, nicht an ihrer
   Anzahl - sonst gaebe es keine Meldung mehr, sobald der Ringpuffer voll
   ist und alte Eintraege hinten herausfallen.                            */
const BASE_TITLE = 'XENO';
const LOUD = new Set(['critical_change', 'degraded']);
let lastAlertAt = 0;
let primed = false;   // erste Abfrage legt nur den Ausgangsstand fest
let flashTimer = null;
let unseen = 0;

function askNotify() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(updateBell);
}

function updateBell() {
  const bell = document.getElementById('bell');
  bell.hidden = !('Notification' in window) || Notification.permission !== 'default';
}

function beep(loud) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = loud ? 660 : 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (loud ? 0.5 : 0.18));
    osc.start();
    osc.stop(ctx.currentTime + (loud ? 0.52 : 0.2));
    if (loud) setTimeout(() => beep(false), 260);
  } catch (e) { /* Ton ist Beiwerk, kein Grund für einen Fehler */ }
}

function flashTitle() {
  if (flashTimer) return;
  let on = false;
  flashTimer = setInterval(() => {
    on = !on;
    document.title = on ? `(${unseen}) neue Meldung` : BASE_TITLE;
  }, 900);
}

function clearFlash() {
  if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
  unseen = 0;
  document.title = BASE_TITLE;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) clearFlash(); });
window.addEventListener('focus', clearFlash);

function announce(alerts) {
  const newest = alerts.length ? Math.max(...alerts.map(a => a.at)) : 0;

  // Beim ersten Laden nur den Ausgangsstand merken, sonst würde der ganze
  // bisherige Verlauf auf einmal hereinpoltern.
  if (!primed) { primed = true; lastAlertAt = newest; return; }

  const fresh = alerts.filter(a => a.at > lastAlertAt);
  lastAlertAt = Math.max(lastAlertAt, newest);
  if (!fresh.length) return;

  const loud = fresh.some(a => LOUD.has(a.kind));
  beep(loud);

  if ('Notification' in window && Notification.permission === 'granted') {
    fresh.slice(0, 3).forEach(a => {
      try {
        new Notification(`${a.title}: ${a.symbol || a.mint.slice(0, 10)}`, {
          body: a.lines[0] || '',
          tag: a.mint,
          requireInteraction: LOUD.has(a.kind),
        });
      } catch (e) { /* manche Browser blocken ohne Service Worker */ }
    });
  }

  if (document.hidden) { unseen += fresh.length; flashTitle(); }
}

function api(path, options = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, options.headers || {});
  if (token) headers['X-Auth-Token'] = token;
  return fetch(path, Object.assign({}, options, {headers})).then(r => {
    if (!r.ok) return r.json().catch(() => ({error: 'HTTP ' + r.status})).then(e => Promise.reject(e.error));
    return r.json();
  });
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(v) {
  if (v == null) return '–';
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'k';
  return '$' + Math.round(v);
}

function ago(ts) {
  if (!ts) return 'nie';
  const s = Date.now() / 1000 - ts;
  if (s < 60) return Math.round(s) + 's';
  if (s < 3600) return Math.round(s / 60) + 'min';
  if (s < 86400) return (s / 3600).toFixed(1) + 'h';
  return (s / 86400).toFixed(1) + 'd';
}

function showTab(name) {
  tab = name;
  document.querySelectorAll('.tab').forEach(el => el.hidden = el.id !== 'tab-' + name);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  refresh();
}

const TREND_LABEL = { up: 'AUFWÄRTS', down: 'ABWÄRTS', sideways: 'SEITWÄRTS' };

function pct(v) {
  if (v == null) return '–';
  return (v >= 0 ? '+' : '') + v.toFixed(0) + '%';
}

function num(v) {
  if (v == null) return '–';
  return v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
}

function trendChip(s) {
  if (!s || !TREND_LABEL[s.trend]) return '';
  return `<span class="trend trend-${esc(s.trend)}">${TREND_LABEL[s.trend]}</span>`;
}

// Marktdaten stammen aus der letzten Prüfung, nicht von jetzt. Deshalb steht
// das Alter direkt darunter – sonst liest man einen alten Wert als Live-Kurs.
function figures(m, h) {
  const ch = m.price_change_h1_pct;
  const cls = ch == null ? '' : (ch >= 0 ? ' class="up"' : ' class="down"');
  return `<div class="figures">
    <div><b>${money(m.mcap_usd)}</b><span>MCap</span></div>
    <div><b>${money(m.volume_h1_usd)}</b><span>Vol 1h</span></div>
    <div><b>${money(m.liquidity_usd)}</b><span>Liquidität</span></div>
    <div><b${cls}>${pct(ch)}</b><span>1h</span></div>
    <div><b>${num(m.buyers_h1)}</b><span>Käufer 1h</span></div>
    <div><b>${num(m.trade_count_h1 ?? (m.buys_h1 + m.sells_h1))}</b><span>Trades 1h</span></div>
    <div><b>${h.top10_pct != null ? h.top10_pct.toFixed(0) + '%' : '–'}</b><span>Top 10</span></div>
    <div><b>${m.age_minutes != null ? num(m.age_minutes) + 'min' : '–'}</b><span>Alter</span></div>
  </div>`;
}

function linkRow(m) {
  const out = [];
  for (const [kind, url] of Object.entries(m.socials || {})) {
    out.push(`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(kind)}</a>`);
  }
  (m.websites || []).forEach(u => out.push(`<a href="${esc(u)}" target="_blank" rel="noopener">web</a>`));
  return out.length ? `<div class="links">${out.join('')}</div>` : '';
}

function usd(v) {
  if (v == null) return '–';
  return (v >= 0 ? '+' : '−') + '$' + Math.abs(v).toFixed(2);
}

// Einstieg → jetzt. Ohne den Einstiegswert daneben sagt der aktuelle
// Marktwert nichts darüber, ob die Position läuft.
function positionRow(p) {
  if (!p) return '';
  const cls = p.result_usd == null ? '' : (p.result_usd >= 0 ? 'plus' : 'minus');
  const status = p.open ? '' : ` · ${esc(p.exit_reason)}`;
  return `<div class="pos">
    <span>${money(p.entry_mcap_usd)}</span>
    <span class="arrow">→</span>
    <span>${money(p.current_mcap_usd)}</span>
    <span class="pl ${cls}">${usd(p.result_usd)}${status}</span>
  </div>`;
}

function tokenCard(t) {
  const m = t.market || {};
  const h = t.holders || {};
  const findings = (t.top_findings || [])
    .map(f => `<div class="finding ${esc(f.severity)}">${esc(f.message)}</div>`).join('');

  return `<div class="card ${t.watchlisted ? 'wl' : ''}">
    <div class="card-head">
      <span class="badge ${esc(t.verdict)}">${esc(t.verdict)}</span>
      <span class="sym">${esc(t.symbol || t.mint.slice(0, 10))}${trendChip(t.structure)}</span>
      <span class="score">${t.score}/100</span>
    </div>
    ${figures(m, h)}
    <div class="asof">Zahlen von der Prüfung vor ${esc(ago(t.last_checked))}</div>
    ${positionRow(positions[t.mint])}
    ${linkRow(m)}
    ${findings}
    <div class="mint">${esc(t.mint)}</div>
    <div class="card-actions">
      ${t.watchlisted
        ? `<button class="danger" onclick="removeWatch('${esc(t.mint)}')">Entfernen</button>`
        : `<button onclick="addWatch('${esc(t.mint)}')">Beobachten</button>`}
      <button onclick="recheck('${esc(t.mint)}')">Neu prüfen</button>
      <button onclick="window.open('https://dexscreener.com/solana/${esc(t.mint)}','_blank')">Chart</button>
    </div>
  </div>`;
}

function renderStatus(s) {
  document.getElementById('dot').className = 'dot' + (s.running && !s.stopping ? ' on' : '');
  const btn = document.getElementById('toggle');
  if (!btn.disabled) btn.textContent = s.running ? 'Stopp' : 'Start';
  const profil = s.profile ? ` · Profil ${s.profile.name}` : '';
  document.getElementById('sub').textContent = s.stopping
    ? 'hält an — laufende Prüfung wird noch beendet'
    : s.running
      ? `läuft · alle ${Math.round(s.interval)}s · ${s.cycles} Durchläufe${profil}`
      : `gestoppt${profil}`;
  document.getElementById('s-checked').textContent = s.checked_total;
  document.getElementById('s-wl').textContent = s.watchlist;
  document.getElementById('s-alerts').textContent = s.alerts;

  const notes = [];
  if (s.uses_public_rpc) {
    notes.push(`<div class="note warn">Öffentlicher RPC aktiv — Holder-Daten kommen von RugCheck.
      Für eigene Chain-Abfrage einen kostenlosen Helius-Key in die <code>.env</code> eintragen.</div>`);
  }
  if (!s.running && s.cycles === 0) {
    notes.push(`<div class="note">Der Watcher läuft noch nicht. Oben auf <b>Start</b> tippen —
      danach sucht er alle 60 Sekunden nach neuen Token.</div>`);
  }
  document.getElementById('notes').innerHTML = notes.join('');
}

function refresh() {
  api('/api/status').then(renderStatus).catch(err => {
    document.getElementById('sub').textContent = 'keine Verbindung: ' + err;
  });

  if (tab === 'tokens' || tab === 'watchlist') {
    api('/api/tokens').then(d => {
      document.getElementById('s-tokens').textContent = d.tokens.length;
      const all = d.tokens.filter(t => t.check_count > 0);
      document.getElementById('tokens').innerHTML = all.length
        ? all.map(tokenCard).join('')
        : '<div class="empty">Noch nichts geprüft.<br>Watcher starten oder oben eine Mint-Adresse prüfen.</div>';

      const wl = d.tokens.filter(t => t.watchlisted);
      document.getElementById('watchlist').innerHTML = wl.length
        ? wl.map(tokenCard).join('')
        : '<div class="empty">Watchlist ist leer.<br>Mint-Adresse oben einfügen und auf Beobachten tippen.</div>';
    }).catch(() => {});
  }

  // Immer abfragen, nicht nur im Meldungs-Tab: sonst gäbe es keinen
  // Hinweis, während man auf der Tokenliste steht.
  api('/api/alerts').then(d => {
    announce(d.alerts);
    if (tab === 'alerts') {
      document.getElementById('alerts').innerHTML = d.alerts.length
        ? d.alerts.map(a => `<div class="card">
            <span class="when">${ago(a.at)} her</span>
            <div class="alert-kind kind-${esc(a.kind)}">${esc(a.title)}</div>
            <div class="card-head" style="margin-top:6px">
              <span class="badge ${esc(a.verdict)}">${esc(a.verdict)}</span>
              <span class="sym">${esc(a.symbol || a.mint.slice(0, 10))}${trendChip(a.structure)}</span>
            </div>
            ${a.market ? figures(a.market, {}) : ''}
            ${a.market ? linkRow(a.market) : ''}
            ${a.lines.slice(1).map(l => `<div class="finding info">${esc(l)}</div>`).join('')}
            <div class="mint">${esc(a.mint)}</div>
          </div>`).join('')
        : '<div class="empty">Noch keine Meldungen.</div>';
    }
  }).catch(() => {});

  // Immer holen, nicht nur im Trades-Tab: die Tokenkarten zeigen die
  // offenen Positionen mit an.
  api('/api/trades').then(d => {
    positions = {};
    (d.positions || []).forEach(p => { if (!positions[p.mint]) positions[p.mint] = p; });
    if (tab === 'trades') renderTrades(d);
  }).catch(() => {});

  if (tab === 'log') {
    api('/api/log').then(d => {
      document.getElementById('log').textContent = d.lines.slice().reverse().join('\n') || 'leer';
    }).catch(() => {});
  }
}

// Reihenfolge von gut nach schlecht. CALL steht vorn, weil der Vergleich
// mit OK die eigentliche Frage beantwortet: bringen die strengen
// Bedingungen etwas, oder sorgen sie nur für weniger Trades?
const GROUP_ORDER = ['CALL', 'OK', 'CAUTION', 'RISKY', 'AVOID', 'UNKNOWN', 'CONTROL'];
// Ein Name je Gruppe, überall derselbe. Intern heißt die Vergleichsgruppe
// CONTROL – das ist der gespeicherte Wert und bleibt so; angezeigt wird
// aber nur „Abgelehnt", sonst stehen für dieselbe Sache zwei Wörter auf
// einer Seite.
const GROUP_LABEL = {
  CALL: 'Calls', OK: 'OK', CAUTION: 'Mittel', RISKY: 'Riskant',
  AVOID: 'Vermeiden', UNKNOWN: 'Unbekannt', CONTROL: 'Abgelehnt',
};

function renderTrades(d) {
  const box = document.getElementById('trades');
  if (!d.available) {
    box.innerHTML = '<div class="empty">Papierhandel nicht aktiv.</div>';
    return;
  }
  const t = d.total || {};
  if (!t.closed && !t.open) {
    box.innerHTML = '<div class="empty">Noch keine Positionen. '
      + 'Der Bot simuliert jeden geprüften Token — nach ein paar Durchläufen steht hier etwas.</div>';
    return;
  }

  const groups = d.groups || {};
  const rows = GROUP_ORDER.filter(g => groups[g]).map(g => [g, groups[g]]);
  // Beste Gruppe hervorheben – das ist die Zeile, wegen der es diese Seite gibt.
  const closedRows = rows.filter(([, s]) => s.closed > 0);
  const best = closedRows.length
    ? closedRows.reduce((a, b) => (b[1].result_usd > a[1].result_usd ? b : a))[0]
    : null;

  const plCls = v => v == null ? '' : (v >= 0 ? 'plus' : 'minus');

  box.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${t.closed}</b><span>Abgeschl.</span></div>
      <div class="stat"><b>${t.open}</b><span>Offen</span></div>
      <div class="stat"><b>$${(t.turnover_usd || 0).toFixed(0)}</b><span>Umsatz</span></div>
      <div class="stat"><b class="${plCls(t.result_usd)}">${usd(t.result_usd)}</b><span>Ergebnis</span></div>
    </div>

    <div class="note">Simuliert: 100 $ je Token, raus bei 2x, bei 40 % Verlust
    oder nach 24 Stunden. Kein echtes Geld.<br>
    <b>Abgelehnt</b> sind Token, die schon der Vorfilter aussortiert hat — drei
    zufällige je Durchlauf, nur zum Vergleich mitgemessen. Sie sind der
    Maßstab: laufen sie besser als die geprüften, filtert der Bot falsch.</div>

    <div class="wrap-x"><table class="trades">
      <tr><th>Gruppe</th><th>Trades</th><th>Im Plus</th><th>Median</th><th>Ergebnis</th></tr>
      ${rows.map(([g, s]) => `<tr class="${g === best ? 'best' : ''}">
        <td class="grp ${g}">${GROUP_LABEL[g] || g}</td>
        <td>${s.closed}${s.open ? ' <span class="arrow">+' + s.open + '</span>' : ''}</td>
        <td>${s.closed ? s.win_rate.toFixed(0) + '%' : '–'}</td>
        <td>${s.median_multiple != null ? s.median_multiple.toFixed(2) + 'x' : '–'}</td>
        <td class="${plCls(s.result_usd)}">${s.closed ? usd(s.result_usd) : '–'}</td>
      </tr>`).join('')}
    </table></div>

    ${best ? `<div class="note" style="margin-top:12px">Am besten gelaufen:
      <b>${GROUP_LABEL[best] || best}</b>. Steht dort „Vermeiden" oder „Abgelehnt“,
      filtert der Bot in die falsche Richtung.</div>` : ''}

    <h3 style="font-size:13px;color:var(--muted);margin:18px 0 8px;font-weight:500">Positionen</h3>
    ${(d.positions || []).slice(0, 60).map(p => `<div class="card">
      <div class="card-head">
        <span class="badge ${esc(p.group)}">${esc(GROUP_LABEL[p.group] || p.group)}</span>
        <span class="sym">${esc(p.symbol || p.mint.slice(0, 10))}${p.is_call ? ' 🎯' : ''}</span>
        <span class="score">${p.open ? 'offen' : esc(p.exit_reason)}</span>
      </div>
      ${positionRow(p)}
      <div class="asof">seit ${esc(ago(p.opened_at))}</div>
    </div>`).join('')}
  `;
}

function toggleWatcher() {
  const btn = document.getElementById('toggle');
  const starting = btn.textContent === 'Start';
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  api('/api/watcher/' + (starting ? 'start' : 'stop'), {method: 'POST', body: '{}'})
    .then(renderStatus)
    .catch(err => alert('Fehler: ' + err))
    .finally(() => { btn.disabled = false; refresh(); });
}

function addWatch(mint) {
  const value = mint || document.getElementById('mint').value.trim();
  if (!value) return;
  api('/api/watchlist', {method: 'POST', body: JSON.stringify({mint: value})})
    .then(() => { document.getElementById('mint').value = ''; refresh(); })
    .catch(err => alert('Fehler: ' + err));
}

function removeWatch(mint) {
  api('/api/watchlist/' + encodeURIComponent(mint), {method: 'DELETE'})
    .then(refresh).catch(err => alert('Fehler: ' + err));
}

function runCheck(mint) {
  if (busy) return;
  busy = true;
  const previous = document.getElementById('sub').textContent;
  document.getElementById('sub').innerHTML = '<span class="spin"></span> prüfe ' + esc(mint.slice(0, 10)) + ' …';
  api('/api/check', {method: 'POST', body: JSON.stringify({mint})})
    .then(r => { document.getElementById('mint').value = ''; alert(`${r.symbol || 'Token'}: ${r.verdict} (${r.score}/100)`); })
    .catch(err => alert('Fehler: ' + err))
    .finally(() => { busy = false; document.getElementById('sub').textContent = previous; refresh(); });
}

function checkNow() {
  const value = document.getElementById('mint').value.trim();
  if (value) runCheck(value);
}
const recheck = runCheck;

updateBell();
refresh();
setInterval(refresh, 5000);
</script>
</body>
